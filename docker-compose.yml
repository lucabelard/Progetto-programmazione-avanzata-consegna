
services:
  # ─────────────────────────────────────────────
  # App Node.js / Express
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: progetto_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./src:/app/src
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-gridpath_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      # JWT RS256 – in dev usiamo una coppia di chiavi di test
      # In produzione sostituire con chiavi RSA reali nel file .env
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      INITIAL_USER_TOKENS: 100
      LOG_LEVEL: debug
      API_PREFIX: /api/v1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  # ─────────────────────────────────────────────
  # Database PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: progetto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gridpath_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gridpath_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app_network

  # ─────────────────────────────────────────────
  # pgAdmin (GUI per il DB – solo sviluppo)
  # Avvia con: docker-compose --profile tools up
  # Poi vai su http://localhost:5050
  # Login: admin@admin.com / admin
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: progetto_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app_network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge
